services:
    web:
        build: ./backend

        volumes:
            - ./.env:/backend/.env

        ports:
            - "8000:8000"

        env_file:
            - .env

        develop:
            # Create a `watch` configuration to update the app
            watch:
                # Sync the working directory with the `/app` directory in the container
                - action: sync
                  path: ./backend
                  target: /app
                  ignore:
                      - .venv/

                # Rebuild the image if dependencies change by checking uv.lock
                - action: rebuild
                  path: ./uv.lock
        
        image: narrow_hh-web:latest
